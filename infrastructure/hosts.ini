# RKE2 inventory
# rke2_servers: control plane + etcd. Use an ODD number for etcd quorum:
#               1 for a lab, 3 for HA (tolerates one server failure).
# rke2_agents:  worker nodes. May be empty for a single-node lab.
# The first host in rke2_servers bootstraps the cluster.

[rke2_servers]
192.168.1.10

[rke2_agents]
192.168.1.11
192.168.1.12

[k8s:children]
rke2_servers
rke2_agents

[k8s:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
# Registration address other nodes join through. For HA, point this at a
# fixed VIP / DNS name / load balancer in front of all servers (ports 9345, 6443).
rke2_api_endpoint=192.168.1.10
# Extra SANs for the API server certificate (comma separated, optional).
rke2_tls_san=rke2.sovereign.lan

version: '3.8'
services:
  mailcow:
    image: mailcow/mailcow-dockerized:latest
    container_name: mailcow
    environment:
      - MAILCOW_HOSTNAME=mail.local
      - MAILCOW_TIMEZONE=Europe/Istanbul
    ports:
      - "25:25"    # SMTP
      - "80:80"    # Web HTTP
      - "443:443"  # Web HTTPS
      - "465:465"  # SMTPS
      - "587:587"  # Submission
      - "993:993"  # IMAPS
      - "995:995"  # POP3S
      - "4190:4190" # Sieve
      - "8081:8081" # Web admin (örnek)
    volumes:
      - mailcow_data:/var/lib/mailcow
    restart: unless-stopped
  nextcloud:
    image: nextcloud:28
    container_name: nextcloud
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloudpass
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    environment:
      - MYSQL_ROOT_PASSWORD=supersecret
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloudpass
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  authentik:
    image: authentik/authentik:2024.2.2
    container_name: authentik
    environment:
      - AUTHENTIK_SECRET_KEY=changeme
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=authentikpass
      - AUTHENTIK_POSTGRESQL__NAME=authentik
    ports:
      - "9000:9000"
    depends_on:
      - authentik-db
    restart: unless-stopped

  authentik-db:
    image: postgres:15
    container_name: authentik-db
    environment:
      - POSTGRES_DB=authentik
      - POSTGRES_USER=authentik
      - POSTGRES_PASSWORD=authentikpass
    volumes:
      - authentik_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  samba:
    image: dperson/samba:latest
    container_name: samba
    environment:
      - USERID=1000
      - GROUPID=1000
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - samba_data:/mount
    command: "-u \"user;password\" -s \"share;/mount;yes;no;no;all\""
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  wazuh:
    image: wazuh/wazuh:4.7.3
    container_name: wazuh
    ports:
      - "55000:55000"
      - "1514:1514/udp"
    volumes:
      - wazuh_data:/var/ossec/data
    restart: unless-stopped

volumes:
  mailcow_data:
  nextcloud_data:
  db_data:
  authentik_db_data:
  samba_data:
  prometheus_data:
  grafana_data:
  wazuh_data:

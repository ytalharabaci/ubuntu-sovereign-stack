# =====================================================================
# EXPERIMENTAL / UNSUPPORTED - NOT PART OF THE SUPPORTED DEPLOYMENT FLOW
# =====================================================================
# Zimbra has no official, maintained container image. The image below is a
# placeholder and has not been verified. Do not deploy this to production.
# Build and verify your own image, pin it by version/digest, and document its
# source, licence and update process before promoting it out of experimental/.
# For a containerised mail stack, see small-scale/mailcow/ (also unverified on K8s).
apiVersion: v1
kind: Namespace
metadata:
  name: collaboration
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zimbra
  namespace: collaboration
  labels:
    app: zimbra
spec:
  serviceName: "zimbra"
  replicas: 1
  selector:
    matchLabels:
      app: zimbra
  template:
    metadata:
      labels:
        app: zimbra
    spec:
      containers:
        - name: zimbra
          # PLACEHOLDER: replace with a self-built, version-pinned image.
          image: registry.example.invalid/zimbra-ose:CHANGE_ME
          ports:
            - containerPort: 25
              name: smtp
            - containerPort: 80
              name: web-http
            - containerPort: 443
              name: web-https
            - containerPort: 110
              name: pop3
            - containerPort: 143
              name: imap
            - containerPort: 993
              name: imaps
            - containerPort: 995
              name: pop3s
            - containerPort: 7071
              name: admin-console
          env:
            - name: ZIMBRA_HOSTNAME
              value: "mail.sovereign.lan"
            - name: EXPLICIT_ENABLE_CLAMAV
              value: "true" # Ensuring Security layer
            - name: EXPLICIT_ENABLE_SPAMASSASSIN
              value: "true" # Ensuring Security layer
          volumeMounts:
            - name: zimbra-data
              mountPath: /opt/zimbra
  volumeClaimTemplates:
    - metadata:
        name: zimbra-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zimbra
  namespace: collaboration
spec:
  type: NodePort # Or LoadBalancer in a real MetalLB setup
  ports:
    - port: 25
      targetPort: 25
      name: smtp
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
    - port: 7071
      targetPort: 7071
      name: admin
  selector:
    app: zimbra

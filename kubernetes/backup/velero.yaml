# Velero configuration (backup schedule + storage location)
#
# Supported install path is the official Helm chart, which ships the CRDs,
# RBAC and the AWS (S3) object-store plugin. Install it BEFORE applying this file:
#
#   scripts/bootstrap-secrets.sh            # creates velero/cloud-credentials from the MinIO keys
#   helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
#   helm install velero vmware-tanzu/velero --version 12.2.1 -n velero --create-namespace \
#     --set image.tag=v1.18.4 \
#     --set initContainers[0].name=velero-plugin-for-aws \
#     --set initContainers[0].image=velero/velero-plugin-for-aws:v1.14.4 \
#     --set initContainers[0].volumeMounts[0].mountPath=/target \
#     --set initContainers[0].volumeMounts[0].name=plugins \
#     --set credentials.existingSecret=cloud-credentials \
#     --set configuration.features=EnableCSI \
#     --set deployNodeAgent=true \
#     --set backupsEnabled=false --set snapshotsEnabled=false
#
# Volume snapshots use CSI (Longhorn's snapshot class below); there is no
# provider-specific VolumeSnapshotLocation for Longhorn.
#
# IMPORTANT: Kubernetes-object backups are not consistent database backups.
# Run application-level dumps (pg_dump, mysqldump) as well, and prove restores
# with a restore drill (see docs/OPERATIONAL_RUNBOOK.md, docs/TEST_RESULTS.md).
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
spec:
  provider: aws
  default: true
  objectStorage:
    bucket: backup-uss
  credential:
    name: cloud-credentials
    key: cloud
  config:
    region: us-east-1
    s3ForcePathStyle: "true"
    s3Url: http://minio.backup.svc:9000
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-velero
  labels:
    velero.io/csi-volumesnapshot-class: "true"
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  type: snap
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-default
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    ttl: 720h
    includedNamespaces:
      - "*"
    excludedNamespaces:
      - kube-system
      - velero
    storageLocation: default
    snapshotVolumes: true

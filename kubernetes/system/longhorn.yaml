# Longhorn is installed with Helm: infrastructure/install-longhorn.sh
# The chart creates the `longhorn-system` namespace and the default `longhorn`
# StorageClass (3 replicas by default). Tune it through Helm values instead of
# applying a second StorageClass here, e.g.:
#   infrastructure/install-longhorn.sh --set persistence.defaultClassReplicaCount=1   # single-node lab
#   infrastructure/install-longhorn.sh --set persistence.reclaimPolicy=Retain
#
# Optional: a Retain StorageClass for data you never want deleted with its PVC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-retain
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "2880"
  fsType: "ext4"

# cert-manager issuers (ClusterIssuer is cluster-scoped).
# `ca-issuer` expects the CA keypair in Secret `ca-key-pair` in the
# cert-manager namespace (the cluster resource namespace).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: ca-key-pair

# MetalLB L2 address pool (metallb.io/v1beta1 CRDs, MetalLB >= 0.13)
# Install MetalLB first, e.g.:
#   helm repo add metallb https://metallb.github.io/metallb
#   helm install metallb metallb/metallb --version 0.16.1 -n metallb-system --create-namespace
#   kubectl -n metallb-system rollout status deploy/metallb-controller
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.200-192.168.1.250  # UPDATE THIS RANGE TO MATCH YOUR NETWORK
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
    - default
